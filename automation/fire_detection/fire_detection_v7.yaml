blueprint:
  name: Fire Detection Blueprint
  description: 'Fire detection using time-based polling with appliance shutdown and
    camera snapshots.


    **IMPORTANT:** Before using camera snapshots, create the folder manually:

    `mkdir -p /config/www/fire_snapshots`

    '
  domain: automation
  source_url: https://raw.githubusercontent.com/joshuaaaaa/HA-Hori/refs/heads/claude/fire-detection-blueprint-cx6Ql/automation/fire_detection/fire_detection_v7.yaml
  input:
    threshold:
      name: Fire Temperature Threshold
      description: Temperature threshold in °C that triggers fire alarm
      default: 60
      selector:
        number:
          min: 20.0
          max: 150.0
          step: 0.5
          unit_of_measurement: °C
          mode: slider
    include:
      name: Monitored Temperature Sensors
      description: Select temperature sensors to monitor for fire detection
      default:
        entity_id: []
      selector:
        target:
          entity:
          - device_class:
            - temperature
    minimum_duration:
      name: Minimum Duration Above Threshold
      description: How long temperature must stay above threshold before triggering
        alarm (prevents false alarms)
      default: 30
      selector:
        number:
          min: 0.0
          max: 300.0
          step: 5.0
          unit_of_measurement: seconds
          mode: slider
    alarm_control:
      name: Manual Alarm Control (Input Boolean)
      description: Optional input_boolean to manually disable alarm
      default: ''
      selector:
        entity:
          domain:
          - input_boolean
          reorder: false
          multiple: false
    enable_appliance_shutdown:
      name: Enable Automatic Appliance Shutdown
      description: Automatically turn off selected appliances when fire is detected
      default: false
      selector:
        boolean: {}
    appliance_entities:
      name: Appliances to Shutdown
      description: Select switches, lights, climate devices, water heaters, etc. to
        turn off during fire alarm
      default: {}
      selector:
        target:
          entity:
          - domain:
            - switch
          - domain:
            - light
          - domain:
            - climate
          - domain:
            - water_heater
          - domain:
            - fan
          - domain:
            - humidifier
    enable_camera_snapshot:
      name: Enable Camera Snapshots
      description: Take camera snapshots and send via Telegram when fire is detected
      default: false
      selector:
        boolean: {}
    camera_entities:
      name: Camera Entities
      description: Select cameras to capture snapshots (OPTIONAL - can be empty)
      default: {}
      selector:
        target:
          entity:
          - domain:
            - camera
    camera_snapshot_delay:
      name: Delay Between Camera Snapshots
      description: Delay in seconds between capturing each camera snapshot (0-3600s
        = 0-60min)
      default: 1
      selector:
        number:
          min: 0.0
          max: 3600.0
          step: 1.0
          unit_of_measurement: seconds
          mode: slider
    enable_sirens:
      name: Enable Sirens/Alarms
      description: Activate physical sirens or alarm devices
      default: false
      selector:
        boolean: {}
    siren_entities:
      name: Siren/Alarm Entities
      description: Select sirens, switches or alarm control panels
      default: {}
      selector:
        target:
          entity:
          - domain:
            - switch
          - domain:
            - siren
          - domain:
            - alarm_control_panel
    enable_light_alarm:
      name: Enable Light Alarm
      description: Activate light alarm with custom color and effects
      default: false
      selector:
        boolean: {}
    light_entities:
      name: Light Entities
      description: Select lights for visual alarm (OPTIONAL - can be empty)
      default: {}
      selector:
        target:
          entity:
          - domain:
            - light
    light_mode:
      name: Light Alarm Mode
      description: How lights should behave during alarm
      default: blink
      selector:
        select:
          options:
          - label: Blikání (Flash)
            value: blink
          - label: Konstantní svícení (Solid)
            value: solid
          - label: Pulzování (Pulse)
            value: pulse
          multiple: false
          custom_value: false
          sort: false
    light_color:
      name: Light Alarm Color
      description: Color for light alarm
      default:
      - 255
      - 0
      - 0
      selector:
        color_rgb: {}
    light_brightness:
      name: Light Brightness
      description: Brightness level for alarm lights (0-255)
      default: 255
      selector:
        number:
          min: 1.0
          max: 255.0
          step: 1.0
          mode: slider
    blink_speed:
      name: Blink Speed
      description: Speed of blinking in seconds (lower = faster)
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 5.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider
    restore_lights:
      name: Restore Light State After Alarm
      description: Restore previous light state when alarm ends
      default: true
      selector:
        boolean: {}
    enable_telegram:
      name: Enable Telegram Notifications
      description: Send fire alerts via Telegram
      default: true
      selector:
        boolean: {}
    telegram_method:
      name: Metoda odesílání Telegram zpráv
      description: Vyberte, jakým způsobem se mají odesílat Telegram notifikace
      default: legacy
      selector:
        select:
          options:
          - label: Starší způsob (notify servis)
            value: legacy
          - label: Novější způsob (telegram_bot.send_message)
            value: new
          multiple: false
          custom_value: false
          sort: false
    telegram_service:
      name: Telegram Service (starší způsob)
      description: Telegram notification service to use (použije se jen pro starší
        způsob)
      default: notify.telegram
      selector:
        text:
          multiline: false
          multiple: false
    telegram_bot_entity:
      name: Telegram Bot Entity (nový způsob)
      description: notify.* entita pro telegram_bot.send_message (použije se jen
        pro nový způsob)
      default: ''
      selector:
        entity:
          domain:
          - notify
          multiple: false
    telegram_message_thread_id:
      name: Message Thread ID (nový způsob)
      description: ID vlákna/tématu ve skupině pro telegram_bot.send_message (0 =
        nepoužito)
      default: 0
      selector:
        number:
          min: 0.0
          max: 999999.0
          step: 1.0
          mode: box
    telegram_message:
      name: Telegram Alarm Message
      description: Custom message for Telegram alarm notification
      default: "\U0001F525 POŽÁRNÍ POPLACH! \U0001F525\n⚠️ Detekována vysoká teplota!\n"
      selector:
        text:
          multiline: true
          multiple: false
    enable_mobile:
      name: Enable Mobile App Notifications
      description: Send fire alerts to mobile app
      default: false
      selector:
        boolean: {}
    mobile_service:
      name: Mobile App Service
      description: Mobile app notification service to use
      default: notify.mobile_app_phone
      selector:
        text:
          multiline: false
          multiple: false
    mobile_title:
      name: Mobile Alarm Title
      description: Title for mobile app alarm notification
      default: "\U0001F525 POŽÁRNÍ POPLACH!"
      selector:
        text:
          multiline: false
          multiple: false
    mobile_message:
      name: Mobile Alarm Message
      description: Message for mobile app alarm notification
      default: ⚠️ Detekována vysoká teplota!
      selector:
        text:
          multiline: false
          multiple: false
    mobile_channel:
      name: Mobile Notification Channel
      description: Android notification channel
      default: alarm
      selector:
        text:
          multiline: false
          multiple: false
    enable_ha_notification:
      name: Enable HA Persistent Notifications
      description: Create persistent notification in Home Assistant
      default: false
      selector:
        boolean: {}
    ha_notification_id:
      name: HA Notification ID
      description: Unique ID for persistent notification
      default: fire_alert
      selector:
        text:
          multiline: false
          multiple: false
    ha_notification_title:
      name: HA Alarm Title
      description: Title for persistent alarm notification
      default: "\U0001F525 Požární poplach"
      selector:
        text:
          multiline: false
          multiple: false
    enable_media_player:
      name: Enable Media Player TTS
      description: Play TTS message on media player/speaker
      default: false
      selector:
        boolean: {}
    media_player_entities:
      name: Media Player Entities
      description: Select media players/speakers for TTS announcement (OPTIONAL)
      default: {}
      selector:
        target:
          entity:
          - domain:
            - media_player
    tts_service:
      name: TTS Service
      description: Text-to-speech service (tts.cloud_say for Nabu Casa, tts.google_translate_say
        for Google)
      default: tts.cloud_say
      selector:
        text:
          multiline: false
          multiple: false
    tts_alarm_message:
      name: TTS Alarm Message
      description: Message to announce during fire alarm
      default: Pozor! Požární poplach! Detekována vysoká teplota!
      selector:
        text:
          multiline: false
          multiple: false
    tts_language:
      name: TTS Language
      description: Language code for TTS (e.g., cs, en, sk, de)
      default: cs
      selector:
        text:
          multiline: false
          multiple: false
    actions:
      name: Additional Actions
      description: Additional actions to perform when fire is detected
      default: []
      selector:
        action: {}
variables:
  threshold: !input threshold
  include: !input include
  minimum_duration: !input minimum_duration
  alarm_control: !input alarm_control
  enable_light_alarm: !input enable_light_alarm
  light_mode: !input light_mode
  light_color: !input light_color
  light_brightness: !input light_brightness
  blink_speed: !input blink_speed
  restore_lights: !input restore_lights
  light_entities_raw: !input light_entities
  enable_sirens: !input enable_sirens
  enable_media_player: !input enable_media_player
  media_player_entities_raw: !input media_player_entities
  tts_service: !input tts_service
  tts_alarm_message: !input tts_alarm_message
  tts_language: !input tts_language
  enable_telegram: !input enable_telegram
  telegram_message: !input telegram_message
  telegram_method: !input telegram_method
  telegram_bot_entity: !input telegram_bot_entity
  telegram_message_thread_id: !input telegram_message_thread_id
  enable_mobile: !input enable_mobile
  mobile_title: !input mobile_title
  mobile_message: !input mobile_message
  enable_ha_notification: !input enable_ha_notification
  enable_appliance_shutdown: !input enable_appliance_shutdown
  appliance_entities_raw: !input appliance_entities
  enable_camera_snapshot: !input enable_camera_snapshot
  camera_entities_raw: !input camera_entities
  camera_snapshot_delay: !input camera_snapshot_delay
  telegram_service: !input telegram_service
  media_player_entities: "{% set players = media_player_entities_raw %} {% if players
    is mapping and players.entity_id is defined %}\n  {% if players.entity_id is string
    %}\n    {{ [players.entity_id] }}\n  {% else %}\n    {{ players.entity_id }}\n
    \ {% endif %}\n{% else %}\n  []\n{% endif %}\n"
  alarm_enabled: "{% if alarm_control is string and alarm_control != '' %}\n  {{ is_state(alarm_control,
    'on') }}\n{% else %}\n  true\n{% endif %}\n"
  has_light_entities: "{% set lights = light_entities_raw %} {{ lights is mapping
    and (\n  (lights.entity_id is defined and lights.entity_id | length > 0) or\n
    \ (lights.device_id is defined and lights.device_id | length > 0) or\n  (lights.area_id
    is defined and lights.area_id | length > 0)\n) }}\n"
  has_media_players: "{% set players = media_player_entities_raw %} {{ players is
    mapping and (\n  (players.entity_id is defined and players.entity_id | length
    > 0) or\n  (players.device_id is defined and players.device_id | length > 0) or\n
    \ (players.area_id is defined and players.area_id | length > 0)\n) }}\n"
  has_appliances: "{% set appliances = appliance_entities_raw %} {{ appliances is
    mapping and (\n  (appliances.entity_id is defined and appliances.entity_id | length
    > 0) or\n  (appliances.device_id is defined and appliances.device_id | length
    > 0) or\n  (appliances.area_id is defined and appliances.area_id | length > 0)\n)
    }}\n"
  has_cameras: "{% set cameras = camera_entities_raw %} {{ cameras is mapping and
    (\n  (cameras.entity_id is defined and cameras.entity_id | length > 0) or\n  (cameras.device_id
    is defined and cameras.device_id | length > 0) or\n  (cameras.area_id is defined
    and cameras.area_id | length > 0)\n) }}\n"
  camera_entity_ids: "{% set cameras = camera_entities_raw %} {% if cameras is mapping
    and cameras.entity_id is defined %}\n  {% if cameras.entity_id is string %}\n
    \   {{ [cameras.entity_id] }}\n  {% else %}\n    {{ cameras.entity_id }}\n  {%
    endif %}\n{% else %}\n  []\n{% endif %}\n"
  alarm_sensors: "{% set result = namespace(sensors=[]) %} {% for state in states.sensor
    | selectattr('attributes.device_class', '==', 'temperature') %}\n  {% if state.state
    not in ['unknown','unavailable','none'] and state.state | float(-999) != -999
    %}\n    {% if state.state | float > threshold and state.entity_id in include.entity_id
    %}\n      {% set result.sensors = result.sensors + [state.name ~ ' (' ~ state.state
    ~ '°C)'] %}\n    {% endif %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor
    | selectattr('attributes.device_class', '==', 'temperature') | selectattr('state',
    '==', 'on') %}\n  {% if state.entity_id in include.entity_id %}\n    {% set result.sensors
    = result.sensors + [state.name] %}\n  {% endif %}\n{% endfor %} {{ result.sensors
    | join(', ') }}\n"
  alarm_sensor_count: "{% set count = 0 %} {% for state in states.sensor | selectattr('attributes.device_class',
    '==', 'temperature') %}\n  {% if state.state not in ['unknown','unavailable','none']
    and state.state | float(-999) != -999 %}\n    {% if state.state | float > threshold
    and state.entity_id in include.entity_id %}\n      {% set count = count + 1 %}\n
    \   {% endif %}\n  {% endif %}\n{% endfor %} {% for state in states.binary_sensor
    | selectattr('attributes.device_class', '==', 'temperature') | selectattr('state',
    '==', 'on') %}\n  {% if state.entity_id in include.entity_id %}\n    {% set count
    = count + 1 %}\n  {% endif %}\n{% endfor %} {{ count }}\n"
  max_temperature: "{% set temps = [] %} {% for state in states.sensor | selectattr('attributes.device_class',
    '==', 'temperature') %}\n  {% if state.state not in ['unknown','unavailable','none']
    and state.state | float(-999) != -999 %}\n    {% if state.entity_id in include.entity_id
    %}\n      {% set temps = temps + [state.state | float] %}\n    {% endif %}\n  {%
    endif %}\n{% endfor %} {{ temps | max | round(1) if temps | length > 0 else 0
    }}\n"
  telegram_alarm_final: "{{ telegram_message }}\n\U0001F321️ Senzory: {{ alarm_sensors
    }} ⏰ {{ now().strftime('%H:%M:%S %d.%m.%Y') }}\n"
  mobile_alarm_final: '{{ mobile_message }} Senzory: {{ alarm_sensors }}

    '
  ha_alarm_final: '**Detekována vysoká teplota!**

    **Senzory:** {{ alarm_sensors }} **Čas:** {{ now().strftime(''%H:%M:%S %d.%m.%Y'')
    }}

    '
trigger:
- platform: time_pattern
  minutes: /1
action:
- if:
  - condition: template
    value_template: '{{ alarm_enabled and alarm_sensors != '''' }}'
  then:
  - delay:
      seconds: !input minimum_duration
  - condition: template
    value_template: '{{ alarm_sensors != '''' }}'
  - if: '{{ enable_telegram }}'
    then:
    - choose:
      - conditions: '{{ telegram_method == ''new'' }}'
        sequence:
        - service: telegram_bot.send_message
          data:
            entity_id:
            - '{{ telegram_bot_entity }}'
            message: '{{ telegram_alarm_final }}'
            message_thread_id: '{{ telegram_message_thread_id | int(0) if telegram_message_thread_id
              | int(0) > 0 else omit }}'
      default:
      - service: !input telegram_service
        data:
          message: '{{ telegram_alarm_final }}'
  - if: '{{ enable_appliance_shutdown and has_appliances }}'
    then:
    - service: homeassistant.turn_off
      target: !input appliance_entities
    - service: logbook.log
      data:
        name: Fire Detection
        message: Bezpečnostní vypnutí spotřebičů při požárním alarmu
        entity_id: '{{ appliance_entities_raw.entity_id if appliance_entities_raw.entity_id
          is defined else [] }}'
  - if: '{{ enable_light_alarm and restore_lights and has_light_entities }}'
    then:
    - service: scene.create
      data:
        scene_id: fire_alarm_light_backup
        snapshot_entities: "{% if light_entities_raw.entity_id is string %}\n  {{
          [light_entities_raw.entity_id] }}\n{% else %}\n  {{ light_entities_raw.entity_id
          }}\n{% endif %}\n"
  - if: '{{ enable_sirens }}'
    then:
    - service: homeassistant.turn_on
      target: !input siren_entities
  - parallel:
    - sequence:
      - if: '{{ enable_light_alarm and has_light_entities }}'
        then:
        - choose:
          - conditions: '{{ light_mode == ''blink'' }}'
            sequence:
            - repeat:
                while:
                - condition: template
                  value_template: '{{ alarm_sensors != '''' }}'
                sequence:
                - service: light.turn_on
                  target: !input light_entities
                  data:
                    rgb_color: '{{ light_color }}'
                    brightness: '{{ light_brightness }}'
                - delay:
                    seconds: '{{ blink_speed }}'
                - condition: template
                  value_template: '{{ alarm_sensors != '''' }}'
                - service: light.turn_off
                  target: !input light_entities
                - delay:
                    seconds: '{{ blink_speed }}'
          - conditions: '{{ light_mode == ''pulse'' }}'
            sequence:
            - repeat:
                while:
                - condition: template
                  value_template: '{{ alarm_sensors != '''' }}'
                sequence:
                - service: light.turn_on
                  target: !input light_entities
                  data:
                    rgb_color: '{{ light_color }}'
                    brightness: '{{ light_brightness }}'
                    transition: '{{ blink_speed }}'
                - delay:
                    seconds: '{{ blink_speed }}'
                - condition: template
                  value_template: '{{ alarm_sensors != '''' }}'
                - service: light.turn_on
                  target: !input light_entities
                  data:
                    rgb_color: '{{ light_color }}'
                    brightness: '{{ (light_brightness * 0.2) | int }}'
                    transition: '{{ blink_speed }}'
                - delay:
                    seconds: '{{ blink_speed }}'
          - conditions: '{{ light_mode == ''solid'' }}'
            sequence:
            - service: light.turn_on
              target: !input light_entities
              data:
                rgb_color: '{{ light_color }}'
                brightness: '{{ light_brightness }}'
            - wait_template: '{{ alarm_sensors == '''' }}'
              timeout: 01:00:00
              continue_on_timeout: true
        - choose:
          - conditions:
            - '{{ restore_lights }}'
            - condition: template
              value_template: '{{ states(''scene.fire_alarm_light_backup'') not in
                [''unknown'', ''unavailable''] }}'
            sequence:
            - service: scene.turn_on
              data:
                entity_id: scene.fire_alarm_light_backup
          default:
          - service: light.turn_off
            target: !input light_entities
    - sequence:
      - if: '{{ enable_media_player and has_media_players }}'
        then:
        - service: tts.cloud_say
          target:
            entity_id: '{{ media_player_entities }}'
          data:
            message: '{{ tts_alarm_message }}'
      - if: '{{ enable_camera_snapshot and has_cameras }}'
        then:
        - repeat:
            for_each: '{{ camera_entity_ids }}'
            sequence:
            - variables:
                snapshot_ts: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
            - service: camera.snapshot
              data:
                entity_id: '{{ repeat.item }}'
                filename: /config/www/fire_snapshots/{{ repeat.item.split('.')[1]
                  }}_{{ snapshot_ts }}.jpg
            - delay:
                seconds: 2
            - if: '{{ enable_telegram }}'
              then:
              - choose:
                - conditions: '{{ telegram_method == ''new'' }}'
                  sequence:
                  - service: telegram_bot.send_photo
                    data:
                      entity_id:
                      - '{{ telegram_bot_entity }}'
                      message_thread_id: '{{ telegram_message_thread_id | int(0)
                        if telegram_message_thread_id | int(0) > 0 else omit }}'
                      file: /config/www/fire_snapshots/{{ repeat.item.split('.')[1]
                        }}_{{ snapshot_ts }}.jpg
                      caption: "\U0001F525 POŽÁRNÍ POPLACH - {{ state_attr(repeat.item,
                        'friendly_name') or repeat.item }}"
                default:
                - service: !input telegram_service
                  data:
                    message: ''
                    data:
                      photo:
                      - file: /config/www/fire_snapshots/{{ repeat.item.split('.')[1]
                          }}_{{ snapshot_ts }}.jpg
                      caption: "\U0001F525 POŽÁRNÍ POPLACH - {{ state_attr(repeat.item,
                        'friendly_name') or repeat.item }}"
            - delay:
                seconds: '{{ camera_snapshot_delay }}'
      - if: '{{ enable_mobile }}'
        then:
        - service: !input mobile_service
          data:
            title: !input mobile_title
            message: '{{ mobile_alarm_final }}'
            data:
              channel: !input mobile_channel
              importance: high
              priority: high
              ttl: 0
              notification_icon: mdi:fire
      - if: '{{ enable_ha_notification }}'
        then:
        - service: persistent_notification.create
          data:
            notification_id: !input ha_notification_id
            title: !input ha_notification_title
            message: '{{ ha_alarm_final }}'
      - choose:
        - conditions: '{{ true }}'
          sequence: !input actions
mode: restart
max_exceeded: silent
