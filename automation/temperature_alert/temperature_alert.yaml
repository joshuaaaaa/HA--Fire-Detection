blueprint:
  name: Temperature Threshold Alert Blueprint
  description: Universal temperature monitoring with alerts for both high (fire) and low (freeze) temperatures
  domain: automation
  source_url: https://raw.githubusercontent.com/joshuaaaaa/HA-Hori/main/automation/temperature_alert/temperature_alert.yaml

  input:
    # ==========================================
    # Základní nastavení
    # ==========================================
    threshold_mode:
      name: Threshold Mode
      description: Monitor for temperatures ABOVE threshold (fire) or BELOW threshold (freeze)
      default: below
      selector:
        select:
          options:
            - label: Nad prahem (Above) - Požár, přehřátí
              value: above
            - label: Pod prahem (Below) - Mrznutí, podchlazení
              value: below

    threshold:
      name: Temperature Threshold
      description: Temperature threshold in °C
      default: 5
      selector:
        number:
          min: -40
          max: 150
          step: 0.5
          unit_of_measurement: "°C"

    include:
      name: Monitored Temperature Sensors
      description: Select temperature sensors to monitor
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - device_class: temperature

    minimum_duration:
      name: Minimum Duration
      description: How long temperature must stay beyond threshold before triggering alarm
      default: 30
      selector:
        number:
          min: 0
          max: 3600
          step: 5
          unit_of_measurement: seconds

    cooldown_minutes:
      name: Notification Cooldown
      description: Minimum minutes between repeated alarm notifications
      default: 15
      selector:
        number:
          min: 1
          max: 180
          step: 1
          unit_of_measurement: minutes

    alarm_control:
      name: Manual Alarm Control (Input Boolean)
      description: Optional input_boolean to manually disable alarm
      default: {}
      selector:
        entity:
          domain: input_boolean

    # ==========================================
    # Automatické akce při alarmu
    # ==========================================
    enable_auto_actions:
      name: Enable Automatic Actions
      description: Automatically turn on/off devices when alarm triggers
      default: false
      selector:
        boolean:

    entities_to_turn_on:
      name: Entities to Turn ON
      description: Devices to turn ON during alarm (e.g., heaters for freeze, fans for overheat)
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: climate
            - domain: water_heater
            - domain: fan

    entities_to_turn_off:
      name: Entities to Turn OFF
      description: Devices to turn OFF during alarm (e.g., water pumps for freeze, heaters for overheat)
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: climate
            - domain: water_heater
            - domain: fan
            - domain: light

    # ==========================================
    # Telegram Notifications
    # ==========================================
    enable_telegram:
      name: Enable Telegram Notifications
      description: Send temperature alerts via Telegram
      default: true
      selector:
        boolean:

    telegram_service:
      name: Telegram Service
      description: Telegram notification service to use
      default: notify.telegram
      selector:
        text:

    telegram_message_above:
      name: Telegram Message (Above Threshold)
      description: Message when temperature goes ABOVE threshold
      default: "🔥 VYSOKÁ TEPLOTA! 🔥\n⚠️ Teplota překročila horní limit!"
      selector:
        text:
          multiline: true

    telegram_message_below:
      name: Telegram Message (Below Threshold)
      description: Message when temperature goes BELOW threshold
      default: "❄️ NÍZKÁ TEPLOTA! ❄️\n⚠️ Riziko zamrznutí!"
      selector:
        text:
          multiline: true

    # ==========================================
    # HA Persistent Notifications
    # ==========================================
    enable_ha_notification:
      name: Enable HA Persistent Notifications
      description: Create persistent notification in Home Assistant
      default: true
      selector:
        boolean:

    ha_notification_id:
      name: HA Notification ID
      description: Unique ID for persistent notification
      default: temperature_alert
      selector:
        text:

    ha_notification_title_above:
      name: HA Title (Above Threshold)
      description: Title when temperature goes ABOVE threshold
      default: "🔥 Vysoká teplota"
      selector:
        text:

    ha_notification_title_below:
      name: HA Title (Below Threshold)
      description: Title when temperature goes BELOW threshold
      default: "❄️ Nízká teplota"
      selector:
        text:

    # ==========================================
    # Media Player TTS
    # ==========================================
    enable_media_player:
      name: Enable Media Player TTS
      description: Play TTS message on media player/speaker
      default: false
      selector:
        boolean:

    media_player_entities:
      name: Media Player Entities
      description: Select media players/speakers for TTS announcement (OPTIONAL)
      default: {}
      selector:
        target:
          entity:
            domain: media_player

    tts_service:
      name: TTS Service
      description: Text-to-speech service (tts.cloud_say for Nabu Casa, tts.google_translate_say for Google)
      default: tts.cloud_say
      selector:
        text:

    tts_alarm_message_above:
      name: TTS Message (Above Threshold)
      description: Message to announce when temperature goes ABOVE threshold
      default: "Pozor! Vysoká teplota! Přehřátí detekováno!"
      selector:
        text:

    tts_alarm_message_below:
      name: TTS Message (Below Threshold)
      description: Message to announce when temperature goes BELOW threshold
      default: "Pozor! Nízká teplota! Riziko zamrznutí!"
      selector:
        text:

    # ==========================================
    # Additional Actions
    # ==========================================
    actions:
      name: Additional Actions
      description: Additional actions to perform when alarm triggers
      default: []
      selector:
        action: {}

variables:
  threshold_mode: !input threshold_mode
  threshold: !input threshold
  include: !input include
  minimum_duration: !input minimum_duration
  cooldown_minutes: !input cooldown_minutes
  alarm_control: !input alarm_control

  # Auto actions
  enable_auto_actions: !input enable_auto_actions
  entities_to_turn_on_raw: !input entities_to_turn_on
  entities_to_turn_off_raw: !input entities_to_turn_off

  # Notification inputs
  enable_telegram: !input enable_telegram
  telegram_message_above: !input telegram_message_above
  telegram_message_below: !input telegram_message_below
  telegram_service: !input telegram_service

  enable_ha_notification: !input enable_ha_notification
  ha_notification_title_above: !input ha_notification_title_above
  ha_notification_title_below: !input ha_notification_title_below

  # TTS inputs
  enable_media_player: !input enable_media_player
  media_player_entities_raw: !input media_player_entities
  tts_alarm_message_above: !input tts_alarm_message_above
  tts_alarm_message_below: !input tts_alarm_message_below

  # Normalizace entity_id na vždy pole
  include_entity_ids: >
    {% if include is string %}
      {{ [include] }}
    {% else %}
      {{ include }}
    {% endif %}

  # Kontroly
  has_entities: >
    {{ include_entity_ids is defined and include_entity_ids | length > 0 }}

  alarm_enabled: >
    {% if alarm_control is string and alarm_control != '' %}
      {{ is_state(alarm_control, 'on') }}
    {% else %}
      true
    {% endif %}

  has_entities_to_turn_on: >
    {% set entities = entities_to_turn_on_raw %}
    {{ entities is mapping and entities.entity_id is defined and entities.entity_id | length > 0 }}

  has_entities_to_turn_off: >
    {% set entities = entities_to_turn_off_raw %}
    {{ entities is mapping and entities.entity_id is defined and entities.entity_id | length > 0 }}

  has_media_players: >
    {% set players = media_player_entities_raw %}
    {{ players is mapping and players.entity_id is defined and players.entity_id | length > 0 }}

  # ALARM: Senzory mimo práh
  violating_sensors: >
    {% set ns = namespace(list=[]) %}
    {% for s in include_entity_ids %}
      {% set val = states(s) | float(-999) %}
      {% if val != -999 %}
        {% if threshold_mode == 'above' and val > threshold %}
          {% set ns.list = ns.list + [state_attr(s,'friendly_name') ~ ' (' ~ val ~ '°C)'] %}
        {% elif threshold_mode == 'below' and val < threshold %}
          {% set ns.list = ns.list + [state_attr(s,'friendly_name') ~ ' (' ~ val ~ '°C)'] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.list }}

  sensor_count: "{{ violating_sensors | length }}"

  extreme_temp: >
    {% set ns = namespace(temps=[]) %}
    {% for s in include_entity_ids %}
      {% set val = states(s) | float(-999) %}
      {% if val != -999 %}
        {% set ns.temps = ns.temps + [val] %}
      {% endif %}
    {% endfor %}
    {% if ns.temps %}
      {{ ns.temps|max if threshold_mode == 'above' else ns.temps|min }}
    {% else %}
      0
    {% endif %}

  # Cooldown check
  cooldown_check: >
    {% set last_trigger = state_attr(this.entity_id, 'last_triggered') %}
    {% if last_trigger == none %}
      true
    {% else %}
      {{ (as_timestamp(now()) - as_timestamp(last_trigger)) >= (cooldown_minutes * 60) }}
    {% endif %}

  # Pre-computed final messages
  telegram_alarm_final: >
    {% if threshold_mode == 'above' %}
      {{ telegram_message_above }}
    {% else %}
      {{ telegram_message_below }}
    {% endif %}

    🌡️ Senzory: {{ violating_sensors | join(', ') }}
    ⏰ {{ now().strftime('%d.%m.%Y %H:%M:%S') }}

  ha_alarm_final: >
    **Teplotní alarm!**

    **Režim:** {% if threshold_mode == 'above' %}Nad prahem{% else %}Pod prahem{% endif %}
    **Senzory:** {{ violating_sensors | join(', ') }}
    **Čas:** {{ now().strftime('%d.%m.%Y %H:%M:%S') }}

  tts_message_final: >
    {% if threshold_mode == 'above' %}
      {{ tts_alarm_message_above }}
    {% else %}
      {{ tts_alarm_message_below }}
    {% endif %}

  ha_notification_title: >
    {% if threshold_mode == 'above' %}
      {{ ha_notification_title_above }}
    {% else %}
      {{ ha_notification_title_below }}
    {% endif %}

# TIME PATTERN TRIGGER - kontroluje každou minutu
trigger:
  - platform: time_pattern
    minutes: "/1"

# ŽÁDNÉ PODMÍNKY - automatizace se vždy spustí každou minutu
action:
  # Kontrola zda je alarm povolený, jsou senzory mimo práh a cooldown vypršel
  - if:
      - condition: template
        value_template: "{{ alarm_enabled and sensor_count | int > 0 and cooldown_check }}"
    then:
      # Počkat minimum_duration a zkontrolovat znovu
      - delay:
          seconds: !input minimum_duration

      # Zkontrolovat že stále platí alarm
      - condition: template
        value_template: "{{ sensor_count | int > 0 }}"

      # Logbook entry na začátku alarmu
      - service: logbook.log
        data:
          name: "Temperature Alert"
          message: >
            Teplotní alarm aktivován ({{ threshold_mode }}): {{ violating_sensors | join(', ') }}
          entity_id: "{{ include_entity_ids }}"

      # ==========================================
      # AUTOMATICKÉ AKCE
      # ==========================================
      - if: "{{ enable_auto_actions }}"
        then:
          # Zapnout zařízení (např. topení při mrazu)
          - if: "{{ has_entities_to_turn_on }}"
            then:
              - service: homeassistant.turn_on
                target: !input entities_to_turn_on
              - service: logbook.log
                data:
                  name: "Temperature Alert"
                  message: >
                    Automaticky zapnuto při teplotním alarmu ({{ threshold_mode }})
                  entity_id: "{{ entities_to_turn_on_raw.entity_id if entities_to_turn_on_raw.entity_id is defined else [] }}"

          # Vypnout zařízení (např. ventilaci při mrazu)
          - if: "{{ has_entities_to_turn_off }}"
            then:
              - service: homeassistant.turn_off
                target: !input entities_to_turn_off
              - service: logbook.log
                data:
                  name: "Temperature Alert"
                  message: >
                    Automaticky vypnuto při teplotním alarmu ({{ threshold_mode }})
                  entity_id: "{{ entities_to_turn_off_raw.entity_id if entities_to_turn_off_raw.entity_id is defined else [] }}"

      # ==========================================
      # NOTIFIKACE
      # ==========================================

      # TTS hlášení
      - if: "{{ enable_media_player and has_media_players }}"
        then:
          - service: !input tts_service
            target: !input media_player_entities
            data:
              message: "{{ tts_message_final }}"

      # Telegram
      - if: "{{ enable_telegram }}"
        then:
          - service: !input telegram_service
            data:
              message: "{{ telegram_alarm_final }}"

      # HA persistent
      - if: "{{ enable_ha_notification }}"
        then:
          - service: persistent_notification.create
            data:
              notification_id: !input ha_notification_id
              title: "{{ ha_notification_title }}"
              message: "{{ ha_alarm_final }}"

      # Vlastní akce
      - choose:
          - conditions: "{{ true }}"
            sequence: !input actions

mode: restart
max_exceeded: silent
