blueprint:
  name: Fire Detection Blueprint v7 Minimal Test
  description: Minimal fire detection (testing)
  domain: automation

  input:
    threshold:
      name: Fire Temperature Threshold
      default: 60
      selector:
        number:
          min: 20
          max: 150
          unit_of_measurement: "°C"

    include:
      name: Monitored Temperature Sensors
      default: []
      selector:
        entity:
          domain: sensor
          multiple: true

    telegram_service:
      name: Telegram Service
      default: notify.telegram
      selector:
        text:

variables:
  threshold: !input threshold
  include: !input include
  telegram_service: !input telegram_service

  alarm_sensors: >
    {% set r = namespace(list=[]) %}
    {% for s in include %}
      {% if states(s) not in ['unknown','unavailable','none'] %}
        {% if states(s) | float > threshold %}
          {% set r.list = r.list + [state_attr(s,'friendly_name') ~ ' (' ~ states(s) ~ '°C)'] %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ r.list | join(', ') }}

trigger:
  - platform: time_pattern
    minutes: "/1"

condition:
  - condition: template
    value_template: "{{ alarm_sensors != '' }}"

action:
  - service: !input telegram_service
    data:
      message: "🔥 POŽÁRNÍ POPLACH! Senzory: {{ alarm_sensors }}"

mode: single
