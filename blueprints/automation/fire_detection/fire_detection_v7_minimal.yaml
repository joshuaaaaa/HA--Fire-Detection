blueprint:
  name: Fire Detection Blueprint v7 Minimal Test
  description: Minimal fire detection (testing)
  domain: automation

  input:
    threshold:
      name: Fire Temperature Threshold
      default: 60
      selector:
        number:
          min: 20
          max: 150
          unit_of_measurement: "°C"

    include:
      name: Monitored Temperature Sensors
      selector:
        target:
          entity:
            domain: sensor
      default: {}

    telegram_service:
      name: Telegram Service
      default: notify.telegram
      selector:
        text:

variables:
  threshold: !input threshold
  include: !input include
  telegram_service: !input telegram_service

  alarm_sensors: >
    {% set r = namespace(list=[]) %}
    {% for state in states.sensor
         | selectattr('attributes.device_class', '==', 'temperature') %}
      {% if state.entity_id in include.entity_id %}
        {% if state.state not in ['unknown','unavailable','none'] %}
          {% if state.state | float > threshold %}
            {% set r.list = r.list + [state.name ~ ' (' ~ state.state ~ '°C)'] %}
          {% endif %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ r.list | join(', ') }}

trigger:
  - platform: time_pattern
    minutes: /1

condition:
  - condition: template
    value_template: "{{ alarm_sensors != '' }}"

action:
  - service: !input telegram_service
    data:
      message: "🔥 POŽÁRNÍ POPLACH! Senzory: {{ alarm_sensors }}"

mode: single
