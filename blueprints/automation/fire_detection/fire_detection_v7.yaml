blueprint:
  name: Fire Detection Blueprint
  description: Fire detection using time-based polling with appliance shutdown and camera snapshots
  domain: automation
  source_url: https://raw.githubusercontent.com/joshuaaaaa/HA-Hori/claude/fire-detection-blueprint-cx6Ql/blueprints/automation/fire_detection/fire_detection_v7.yaml

  input:
    threshold:
      name: Fire Temperature Threshold
      description: Temperature threshold in °C that triggers fire alarm
      default: 60
      selector:
        number:
          min: 20
          max: 150
          step: 0.5
          unit_of_measurement: "°C"

    include:
      name: Monitored Temperature Sensors
      description: Select temperature sensors to monitor for fire detection
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: sensor

    minimum_duration:
      name: Minimum Duration Above Threshold
      description: How long temperature must stay above threshold before triggering alarm (prevents false alarms)
      default: 30
      selector:
        number:
          min: 0
          max: 300
          step: 5
          unit_of_measurement: seconds

    cooldown_minutes:
      name: Notification Cooldown
      description: Minimum minutes between repeated alarm notifications
      default: 5
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: minutes

    alarm_control:
      name: Manual Alarm Control (Input Boolean)
      description: Optional input_boolean to manually disable alarm
      default: ""
      selector:
        entity:
          domain: input_boolean

    # ==========================================
    # NOVÉ: Automatické vypínání spotřebičů
    # ==========================================
    enable_appliance_shutdown:
      name: Enable Automatic Appliance Shutdown
      description: Automatically turn off selected appliances when fire is detected
      default: false
      selector:
        boolean:

    appliance_entities:
      name: Appliances to Shutdown
      description: Select switches, lights, climate devices, water heaters, etc. to turn off during fire alarm
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: light
            - domain: climate
            - domain: water_heater
            - domain: fan
            - domain: humidifier

    # ==========================================
    # NOVÉ: Camera snapshots
    # ==========================================
    enable_camera_snapshot:
      name: Enable Camera Snapshots
      description: Take camera snapshots and send via Telegram when fire is detected
      default: false
      selector:
        boolean:

    camera_entities:
      name: Camera Entities
      description: Select cameras to capture snapshots (OPTIONAL - can be empty)
      default: {}
      selector:
        target:
          entity:
            - domain: camera

    camera_snapshot_delay:
      name: Delay Between Camera Snapshots
      description: Delay in seconds between capturing each camera snapshot (0-3600s = 0-60min)
      default: 1
      selector:
        number:
          min: 0
          max: 3600
          step: 1
          unit_of_measurement: seconds

    # ==========================================
    # Sirens/Alarms
    # ==========================================
    enable_sirens:
      name: Enable Sirens/Alarms
      description: Activate physical sirens or alarm devices
      default: false
      selector:
        boolean:

    siren_entities:
      name: Siren/Alarm Entities
      description: Select sirens, switches or alarm control panels
      default: {}
      selector:
        target:
          entity:
            - domain: switch
            - domain: siren
            - domain: alarm_control_panel

    # ==========================================
    # Light Alarm
    # ==========================================
    enable_light_alarm:
      name: Enable Light Alarm
      description: Activate light alarm with custom color and effects
      default: false
      selector:
        boolean:

    light_entities:
      name: Light Entities
      description: Select lights for visual alarm (OPTIONAL - can be empty)
      default: {}
      selector:
        target:
          entity:
            domain: light

    light_mode:
      name: Light Alarm Mode
      description: How lights should behave during alarm
      default: blink
      selector:
        select:
          options:
            - label: Blikání (Flash)
              value: blink
            - label: Konstantní svícení (Solid)
              value: solid
            - label: Pulzování (Pulse)
              value: pulse

    light_color:
      name: Light Alarm Color
      description: Color for light alarm
      default: [255, 0, 0]
      selector:
        color_rgb:

    light_brightness:
      name: Light Brightness
      description: Brightness level for alarm lights (0-255)
      default: 255
      selector:
        number:
          min: 1
          max: 255
          step: 1

    blink_speed:
      name: Blink Speed
      description: Speed of blinking in seconds (lower = faster)
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: seconds

    restore_lights:
      name: Restore Light State After Alarm
      description: Restore previous light state when alarm ends
      default: true
      selector:
        boolean:

    # ==========================================
    # Telegram Notifications
    # ==========================================
    enable_telegram:
      name: Enable Telegram Notifications
      description: Send fire alerts via Telegram
      default: true
      selector:
        boolean:

    telegram_service:
      name: Telegram Service
      description: Telegram notification service to use
      default: notify.telegram
      selector:
        text:

    telegram_message:
      name: Telegram Alarm Message
      description: Custom message for Telegram alarm notification
      default: |
        🔥 POŽÁRNÍ POPLACH! 🔥
        ⚠️ Detekována vysoká teplota!
      selector:
        text:
          multiline: true

    # ==========================================
    # Mobile App Notifications
    # ==========================================
    enable_mobile:
      name: Enable Mobile App Notifications
      description: Send fire alerts to mobile app
      default: false
      selector:
        boolean:

    mobile_service:
      name: Mobile App Service
      description: Mobile app notification service to use
      default: notify.mobile_app_phone
      selector:
        text:

    mobile_title:
      name: Mobile Alarm Title
      description: Title for mobile app alarm notification
      default: "🔥 POŽÁRNÍ POPLACH!"
      selector:
        text:

    mobile_message:
      name: Mobile Alarm Message
      description: Message for mobile app alarm notification
      default: "⚠️ Detekována vysoká teplota!"
      selector:
        text:

    mobile_channel:
      name: Mobile Notification Channel
      description: Android notification channel
      default: alarm
      selector:
        text:

    # ==========================================
    # HA Persistent Notifications
    # ==========================================
    enable_ha_notification:
      name: Enable HA Persistent Notifications
      description: Create persistent notification in Home Assistant
      default: false
      selector:
        boolean:

    ha_notification_id:
      name: HA Notification ID
      description: Unique ID for persistent notification
      default: fire_alert
      selector:
        text:

    ha_notification_title:
      name: HA Alarm Title
      description: Title for persistent alarm notification
      default: "🔥 Požární poplach"
      selector:
        text:

    # ==========================================
    # Media Player TTS
    # ==========================================
    enable_media_player:
      name: Enable Media Player TTS
      description: Play TTS message on media player/speaker
      default: false
      selector:
        boolean:

    media_player_entities:
      name: Media Player Entities
      description: Select media players/speakers for TTS announcement (OPTIONAL)
      default: {}
      selector:
        target:
          entity:
            domain: media_player

    tts_service:
      name: TTS Service
      description: Text-to-speech service (tts.cloud_say for Nabu Casa, tts.google_translate_say for Google)
      default: tts.cloud_say
      selector:
        text:

    tts_alarm_message:
      name: TTS Alarm Message
      description: Message to announce during fire alarm
      default: "Pozor! Požární poplach! Detekována vysoká teplota!"
      selector:
        text:

    tts_language:
      name: TTS Language
      description: Language code for TTS (e.g., cs, en, sk, de)
      default: cs
      selector:
        text:

    # ==========================================
    # Additional Actions
    # ==========================================
    actions:
      name: Additional Actions
      description: Additional actions to perform when fire is detected
      default: []
      selector:
        action: {}

variables:
  threshold: !input threshold
  include: !input include
  minimum_duration: !input minimum_duration
  cooldown_minutes: !input cooldown_minutes
  alarm_control: !input alarm_control

  # Light alarm inputs
  enable_light_alarm: !input enable_light_alarm
  light_mode: !input light_mode
  light_color: !input light_color
  light_brightness: !input light_brightness
  blink_speed: !input blink_speed
  restore_lights: !input restore_lights
  light_entities_raw: !input light_entities

  # Siren inputs
  enable_sirens: !input enable_sirens

  # TTS inputs
  enable_media_player: !input enable_media_player
  media_player_entities_raw: !input media_player_entities
  tts_service: !input tts_service
  tts_alarm_message: !input tts_alarm_message
  tts_language: !input tts_language

  # Notification inputs
  enable_telegram: !input enable_telegram
  telegram_message: !input telegram_message

  enable_mobile: !input enable_mobile
  mobile_title: !input mobile_title
  mobile_message: !input mobile_message

  enable_ha_notification: !input enable_ha_notification

  # NOVÉ: Appliance shutdown inputs
  enable_appliance_shutdown: !input enable_appliance_shutdown
  appliance_entities_raw: !input appliance_entities

  # NOVÉ: Camera snapshot inputs
  enable_camera_snapshot: !input enable_camera_snapshot
  camera_entities_raw: !input camera_entities
  camera_snapshot_delay: !input camera_snapshot_delay
  telegram_service: !input telegram_service

  # Normalizace entity_id na vždy pole (array)
  include_entity_ids: >
    {% if include is string %}
      {{ [include] }}
    {% elif include is iterable and include is not mapping and include is not string %}
      {{ include | list }}
    {% else %}
      []
    {% endif %}

  # NOVÉ: Normalizace camera entities z target selectoru
  camera_entity_ids: >
    {% set cameras = camera_entities_raw %}
    {% if cameras is mapping and cameras.entity_id is defined %}
      {% if cameras.entity_id is string %}
        {{ [cameras.entity_id] }}
      {% else %}
        {{ cameras.entity_id }}
      {% endif %}
    {% else %}
      []
    {% endif %}

  # Bezpečnostní kontroly
  has_entities: >
    {{ include_entity_ids is defined and include_entity_ids | length > 0 }}

  alarm_enabled: >
    {% if alarm_control is string and alarm_control != '' %}
      {{ is_state(alarm_control, 'on') }}
    {% else %}
      true
    {% endif %}

  has_light_entities: >
    {% set lights = light_entities_raw %}
    {{ lights is mapping and lights.entity_id is defined and lights.entity_id | length > 0 }}

  has_media_players: >
    {% set players = media_player_entities_raw %}
    {{ players is mapping and players.entity_id is defined and players.entity_id | length > 0 }}

  # NOVÉ: Kontrola zda máme spotřebiče k vypnutí
  has_appliances: >
    {% set appliances = appliance_entities_raw %}
    {{ appliances is mapping and appliances.entity_id is defined and appliances.entity_id | length > 0 }}

  # NOVÉ: Kontrola zda máme kamery
  has_cameras: >
    {% set cameras = camera_entities_raw %}
    {{ cameras is mapping and cameras.entity_id is defined and cameras.entity_id | length > 0 }}

  # ALARM: Senzory nad prahem
  alarm_sensors: >
    {% set r = namespace(list=[]) %}
    {% if has_entities %}
      {% for s in states.sensor | selectattr('attributes.device_class', '==', 'temperature') %}
        {% if s.entity_id in include_entity_ids
           and s.state not in ['unknown','unavailable','none']
           and (s.state is number or s.state | float(-999) != -999) %}
          {% if s.state | float > threshold %}
            {% set r.list = r.list + [s.name ~ ' (' ~ s.state ~ '°C)'] %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ r.list | join(', ') }}

  alarm_sensor_count: >
    {% set count = 0 %}
    {% if has_entities %}
      {% for s in states.sensor | selectattr('attributes.device_class', '==', 'temperature') %}
        {% if s.entity_id in include_entity_ids
           and s.state not in ['unknown','unavailable','none']
           and (s.state is number or s.state | float(-999) != -999) %}
          {% if s.state | float > threshold %}
            {% set count = count + 1 %}
          {% endif %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ count }}

  max_temperature: >
    {% set temps = [] %}
    {% if has_entities %}
      {% for s in states.sensor | selectattr('attributes.device_class', '==', 'temperature') %}
        {% if s.entity_id in include_entity_ids
           and s.state not in ['unknown','unavailable','none']
           and (s.state is number or s.state | float(-999) != -999) %}
          {% set temps = temps + [s.state | float] %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ temps | max | round(1) if temps | length > 0 else 0 }}

  # Zprávy
  telegram_alarm_final: >
    {{ telegram_message }}

    🌡️ Senzory: {{ alarm_sensors }}
    📈 Počet: {{ alarm_sensor_count }}
    🔥 Max: {{ max_temperature }}°C
    ⏰ {{ now().strftime('%H:%M:%S %d.%m.%Y') }}

  mobile_alarm_final: >
    {{ mobile_message }}
    Senzory: {{ alarm_sensors }}
    Max: {{ max_temperature }}°C

  ha_alarm_final: >
    **Detekována vysoká teplota!**

    **Senzory:** {{ alarm_sensors }}
    **Počet:** {{ alarm_sensor_count }}
    **Max:** {{ max_temperature }}°C
    **Čas:** {{ now().strftime('%H:%M:%S %d.%m.%Y') }}

# TRIGGER - pravidelná kontrola každou minutu
trigger:
  - platform: time_pattern
    minutes: "/1"

# PODMÍNKA: Alarm zapnutý + teplota nad prahem + cooldown uplynul
condition:
  - condition: template
    value_template: "{{ alarm_enabled }}"
  - condition: template
    value_template: "{{ alarm_sensors != '' }}"
  # Cooldown: Poslední alarm byl před >= cooldown_minutes
  - condition: template
    value_template: >
      {% set last_trigger = state_attr(this.entity_id, 'last_triggered') %}
      {% if last_trigger == none %}
        true
      {% else %}
        {{ (as_timestamp(now()) - as_timestamp(last_trigger)) >= (cooldown_minutes * 60) }}
      {% endif %}

action:
  # Počkat minimum_duration a zkontrolovat znovu
  - delay:
      seconds: !input minimum_duration

  # Zkontrolovat že stále platí alarm
  - condition: template
    value_template: "{{ alarm_sensors != '' }}"

  # ==========================================
  # NOVÉ: OKAMŽITÉ VYPNUTÍ SPOTŘEBIČŮ
  # ==========================================
  - if: "{{ enable_appliance_shutdown and has_appliances }}"
    then:
      - service: homeassistant.turn_off
        target: !input appliance_entities
      - service: logbook.log
        data:
          name: "Fire Detection"
          message: "Bezpečnostní vypnutí spotřebičů při požárním alarmu"
          entity_id: "{{ appliance_entities_raw.entity_id if appliance_entities_raw.entity_id is defined else [] }}"

  # Uložit stav světel
  - if: "{{ enable_light_alarm and restore_lights and has_light_entities }}"
    then:
      - service: scene.create
        data:
          scene_id: fire_alarm_light_backup
          snapshot_entities: >
            {% if light_entities_raw.entity_id is string %}
              {{ [light_entities_raw.entity_id] }}
            {% else %}
              {{ light_entities_raw.entity_id }}
            {% endif %}

  # Zapnout sirénu
  - if: "{{ enable_sirens }}"
    then:
      - service: homeassistant.turn_on
        target: !input siren_entities

  # Paralelní běh: světla + notifikace (nezávisle)
  - parallel:
      # Větev 1: Světelný alarm
      - sequence:
          - if: "{{ enable_light_alarm and has_light_entities }}"
            then:
              - choose:
                  # Blikání
                  - conditions: "{{ light_mode == 'blink' }}"
                    sequence:
                      - repeat:
                          while:
                            - condition: template
                              value_template: "{{ alarm_sensors != '' }}"
                          sequence:
                            - service: light.turn_on
                              target: !input light_entities
                              data:
                                rgb_color: "{{ light_color }}"
                                brightness: "{{ light_brightness }}"
                            - delay:
                                seconds: "{{ blink_speed }}"
                            - condition: template
                              value_template: "{{ alarm_sensors != '' }}"
                            - service: light.turn_off
                              target: !input light_entities
                            - delay:
                                seconds: "{{ blink_speed }}"

                  # Pulzování
                  - conditions: "{{ light_mode == 'pulse' }}"
                    sequence:
                      - repeat:
                          while:
                            - condition: template
                              value_template: "{{ alarm_sensors != '' }}"
                          sequence:
                            - service: light.turn_on
                              target: !input light_entities
                              data:
                                rgb_color: "{{ light_color }}"
                                brightness: "{{ light_brightness }}"
                                transition: "{{ blink_speed }}"
                            - delay:
                                seconds: "{{ blink_speed }}"
                            - condition: template
                              value_template: "{{ alarm_sensors != '' }}"
                            - service: light.turn_on
                              target: !input light_entities
                              data:
                                rgb_color: "{{ light_color }}"
                                brightness: "{{ (light_brightness * 0.2) | int }}"
                                transition: "{{ blink_speed }}"
                            - delay:
                                seconds: "{{ blink_speed }}"

                  # Konstantní
                  - conditions: "{{ light_mode == 'solid' }}"
                    sequence:
                      - service: light.turn_on
                        target: !input light_entities
                        data:
                          rgb_color: "{{ light_color }}"
                          brightness: "{{ light_brightness }}"
                      - wait_template: "{{ alarm_sensors == '' }}"

              # Obnovit světla po ukončení alarmu
              - choose:
                  - conditions: "{{ restore_lights }}"
                    sequence:
                      - service: scene.turn_on
                        data:
                          entity_id: scene.fire_alarm_light_backup
                default:
                  - service: light.turn_off
                    target: !input light_entities

      # Větev 2: Notifikace + Camera Snapshots (nezávislé na světlech)
      - sequence:
          # TTS hlášení
          - if: "{{ enable_media_player and has_media_players }}"
            then:
              - service: !input tts_service
                target: !input media_player_entities
                data:
                  message: "{{ tts_alarm_message }}"

          # ==========================================
          # NOVÉ: Camera Snapshots + Telegram
          # ==========================================
          - if: "{{ enable_camera_snapshot and enable_telegram and has_cameras }}"
            then:
              - repeat:
                  for_each: "{{ camera_entity_ids }}"
                  sequence:
                    # Pořízení snapshotů
                    - service: camera.snapshot
                      data:
                        entity_id: "{{ repeat.item }}"
                        filename: "/config/www/fire_alarm_{{ repeat.item.split('.')[1] }}_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"

                    # Odeslání přes Telegram
                    - service: !input telegram_service
                      data:
                        message: ""
                        data:
                          photo:
                            - file: "/config/www/fire_alarm_{{ repeat.item.split('.')[1] }}_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg"
                          caption: "🔥 POŽÁRNÍ POPLACH - {{ state_attr(repeat.item, 'friendly_name') or repeat.item }}"

                    # Delay mezi snapshoty
                    - delay:
                        seconds: "{{ camera_snapshot_delay }}"

          # Telegram (základní zpráva)
          - if: "{{ enable_telegram }}"
            then:
              - service: !input telegram_service
                data:
                  message: "{{ telegram_alarm_final }}"

          # Mobile
          - if: "{{ enable_mobile }}"
            then:
              - service: !input mobile_service
                data:
                  title: !input mobile_title
                  message: "{{ mobile_alarm_final }}"
                  data:
                    channel: !input mobile_channel
                    importance: high
                    priority: high
                    ttl: 0
                    notification_icon: mdi:fire

          # HA persistent
          - if: "{{ enable_ha_notification }}"
            then:
              - service: persistent_notification.create
                data:
                  notification_id: !input ha_notification_id
                  title: !input ha_notification_title
                  message: "{{ ha_alarm_final }}"

          # Vlastní akce
          - choose:
              - conditions: "{{ true }}"
                sequence: !input actions

mode: restart
max_exceeded: silent
