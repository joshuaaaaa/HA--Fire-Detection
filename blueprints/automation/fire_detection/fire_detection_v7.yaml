blueprint:
  name: Fire Detection – Simple Threshold Check
  description: >
    Periodically checks selected temperature sensors and triggers actions
    when any sensor exceeds the defined temperature threshold.
  domain: automation

  input:
    threshold:
      name: Temperature Threshold
      description: Temperature above which the alarm is triggered
      default: 60
      selector:
        number:
          min: -20
          max: 150
          step: 1
          unit_of_measurement: "°C"
          mode: slider

    include:
      name: Temperature Sensors
      description: Select temperature sensors to monitor
      default:
        entity_id: []
      selector:
        target:
          entity:
            domain: sensor
            device_class: temperature

    actions:
      name: Actions
      description: >
        Actions to run when threshold is exceeded.
        Use {{ sensors }} to list triggered sensors.
      selector:
        action: {}

variables:
  threshold: !input threshold
  include: !input include

  sensors: >
    {% set result = namespace(list=[]) %}
    {% for s in states.sensor
         | selectattr('attributes.device_class', '==', 'temperature') %}
      {% if s.entity_id in include.entity_id
         and s.state not in ['unknown','unavailable']
         and s.state | float > threshold %}
        {% set result.list = result.list
           + [s.name ~ ' (' ~ s.state ~ ' °C)'] %}
      {% endif %}
    {% endfor %}
    {{ result.list | join(', ') }}

trigger:
  - platform: time_pattern
    minutes: "/1"

condition:
  - condition: template
    value_template: "{{ sensors != '' }}"

action:
  - choose: []
    default: !input actions

mode: single
